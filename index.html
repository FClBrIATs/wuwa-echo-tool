<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ECHO OPTIMIZER — 鳴潮 音骸厳選支援ツール</title>
    <!-- ツール本体は echo-optimizer-v5.index.html です。
         既存の共有リンクを壊さないためファイル名は変更せず、
         GitHub Pages のトップに来た人をここから転送します。
         JSが無効な環境でも meta refresh と下のリンクで到達できます。 -->
    <meta http-equiv="refresh" content="0; url=./echo-optimizer-v5.index.html">
    <link rel="canonical" href="./echo-optimizer-v5.index.html">
    <style>
        :root {
            --bg: #0a0b0e;
            --card: #14161c;
            --border: #2a2e38;
            --p: #d4af37;
            --text: #e8e6e1;
            --text2: #a3a6b0;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                "Noto Sans JP", Meiryo, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 28px 32px;
            text-align: center;
            max-width: 420px;
        }

        h1 {
            font-size: 15px;
            letter-spacing: .08em;
            color: var(--p);
            margin: 0 0 6px;
        }

        p {
            font-size: 12px;
            color: var(--text2);
            line-height: 1.8;
            margin: 0 0 16px;
        }

        a {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: #0a0b0e;
            background: var(--p);
            text-decoration: none;
            padding: 9px 20px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>ECHO OPTIMIZER</h1>
        <p>ツール本体へ移動しています…<br>自動で切り替わらない場合は下のボタンから。</p>
        <a href="./echo-optimizer-v5.index.html">ツールを開く</a>
    </div>
    <script>
        // クエリとハッシュを引き継いで転送する
        // （将来ハッシュに状態を載せた共有URLでもトップ経由で開けるように）
        location.replace('./echo-optimizer-v5.index.html' + location.search + location.hash);
    </script>
</body>

</html>
